<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizz sécurité — CDES</title>
  <meta name="theme-color" content="#003A6E">
  <link rel="icon" type="image/png" href="img/CDES_Logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="quizz.css" />
</head>
<body>

<header class="quizz-header">
  <img src="img/CDES_Logo_blanc.png" alt="CDES">
  <div>
    <h1>Parcours sécurité numérique</h1>
    <p>CDES — Quizz de validation de l'accueil HSE</p>
  </div>
</header>

<div id="quiz-container">
  <div id="progress-wrapper">
    <div id="progress-text">Question 1</div>
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
  </div>

  <h1 id="theme"></h1>

  <!-- bloc question -->
  <div id="question-block">
    <div id="question-text">
      <h2 id="situation"></h2>
      <p id="enonce"></p>
      <div id="propositions"></div>
    </div>
    <img id="image-question-droite" alt="Illustration" />
  </div>

  <!-- Image pour les questions à clics (grande, en dessous) -->
  <div id="image-click-container">
    <img id="image-question-grande" alt="Image cliquable" />
  </div>

  <div class="buttons">
    <button id="valider">Valider</button>
    <button id="suivant" style="display:none;">Suivant ➜</button>
  </div>

  <!-- bloc explication -->
  <div id="explication-block">
    <div id="explication"></div>
    <img id="image-explication" alt="Explication image" />
  </div>
</div>

  <script src="dataquizz.js"></script>
  <script src="quizz.js"></script>
</body>
</html>
