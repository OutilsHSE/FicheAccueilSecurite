<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil HSE — Signatures — CDES</title>
  <meta name="theme-color" content="#003A6E">
  <link rel="icon" type="image/png" href="img/CDES_Logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="sign.css">
</head>

<body>
  <main class="main">
    <div id="page6">
      <div class="section">
        <h2 class="section-title"><span class="dot"></span>Parcours sécurité sur l'ERP</h2>
        <div class="alert alert-rouge">
          <span class="alert-ico">🖥️</span>
          <span>Pour tous les nouveaux arrivants CDES : réaliser le <span class="bold">parcours sécurité</span> sur l'ERP.</span>
        </div>
      </div>

      <div class="section">
        <h2 class="section-title"><span class="dot"></span>Attestation de nage</h2>
        <table class="attestation">
          <tbody>
            <tr>
              <td>
                <img class="nage-img" src="img/savoir-nager.png" alt="savoir nager">
                <div class="texte">
                  <span class="bold">J'atteste sur l'honneur :</span>
                  <div class="pill-group" style="margin-top: 8px;">
                    <label class="pill pill-vert"><input type="checkbox" data-exclusive="nage"> Savoir nager</label>
                    <label class="pill"><input type="checkbox" data-exclusive="nage"> Ne pas savoir nager mais souhaiter bénéficier d'une formation complémentaire de natation</label>
                  </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="section">
        <h2 class="section-title vert"><span class="dot"></span>Engagements</h2>
        <div class="engagements">
          <label class="engagement"><input type="checkbox">
            <span>Je reconnais les risques liés à mon poste ainsi que les fiches de sensibilisation qui m'ont été
              présentées.</span></label>
          <label class="engagement"><input type="checkbox">
            <span>Je reconnais avoir reçu les équipements de protection individuelle,
              avoir été sensibilisé à leur utilisation et aux consignes de sécurité associées,
              et m'engage à les porter et à appliquer ces consignes dans le cadre de mes activités.</span></label>
          <label class="engagement"><input type="checkbox">
            <span>J'atteste avoir réalisé et validé le parcours sécurité numérique.</span></label>
        </div>

        <div class="field" style="margin-top: 14px;">
          <label>Parcours sécurité réalisé via</label>
          <div class="pill-group" style="align-items: center;">
            <label class="pill"><input type="checkbox" id="quizz-kromi" data-exclusive="type-quizz"> Quizz Kromi</label>
            <label class="pill"><input type="checkbox" id="quizz-demat" data-exclusive="type-quizz"> Quizz de la fiche dématérialisée</label>
            <button class="btn btn-vert quizz-button no-print" type="button" onclick="redirectToQuizz()" style="padding: 8px 16px;">🎓 Lancer le quizz</button>
          </div>
        </div>

        <div id="quizz-resultat" class="quizz-resultat" style="display:none;"></div>
      </div>

      <div class="section">
        <h2 class="section-title"><span class="dot"></span>Signatures</h2>
        <div class="grid-2 signatures-grid">
          <div class="sign">
            <span class="sign-titre">Responsable de l'accueil</span>
            <div class="field">
              <label>Date</label>
              <input id="visite-date-reponsable" class="input-bilan" type="date">
            </div>
            <span class="sign-label">Signature :</span>
            <canvas id="drawingCanvasPageSign1" class="signature-canvas"></canvas>
            <button onclick="clearCanvas('drawingCanvasPageSign1')" class="btn btn-ghost no-print" type="button">🧹 Effacer</button>
          </div>
          <div class="sign">
            <span class="sign-titre">Collaborateur accueilli</span>
            <div class="field">
              <label>Date</label>
              <input id="visite-date-collaborateur" class="input-bilan" type="date">
            </div>
            <span class="sign-label">Signature :</span>
            <canvas id="drawingCanvasPageSign2" class="signature-canvas"></canvas>
            <button onclick="clearCanvas('drawingCanvasPageSign2')" class="btn btn-ghost no-print" type="button">🧹 Effacer</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="nav-bar no-print">
    <button class="btn btn-ghost" onclick="navTo('instruction.html')">⬅ Précédent</button>
    <div class="nav-right">
      <button class="btn btn-vert final-button" onclick="printAllPages()">📄 Exporter la fiche (PDF)</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="ui.js"></script>
  <script src="sign.js"></script>
</body>

</html>
